name: ci-windows-mscl

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
  schedule:
    - cron: "42 3 * * *"
      timezone: "Europe/Moscow"
  repository_dispatch:
    types: [dispatch-event]

jobs:
  ci-job:
    strategy:
      fail-fast: false
      matrix:
        studio: [18]
        dll: [ON, OFF]
        without_crt: [ON, OFF]
        target: [x64, ARM64]
        build-type: [Debug, Release]
        os: [windows-latest, windows-11-vs2026-arm]
        exclude:
          - os: windows-latest
            target: ARM64
          - os: windows-11-vs2026-arm
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true
    - name: ci-step
      env:
        CI_MAKE_TARGET: ""
      shell: bash
      run: |
        if [ "${{ matrix.target }}" = 'Win32' ]; then export TARGET_BIN="bin"; else export TARGET_BIN="${{ matrix.target }}/bin"; fi && \
        export STUDIO_CLANG_DIR="/c/Program Files/Microsoft Visual Studio/${{ matrix.studio }}/Enterprise/VC/Tools/Llvm/${TARGET_BIN}" && \
        export CC="${STUDIO_CLANG_DIR}/clang.exe" CXX="${STUDIO_CLANG_DIR}/clang++.exe" && \
        . ci/ci.sh "-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}|-DMDBX_BUILD_SHARED_LIBRARY:BOOL=${{ matrix.dll }}|-DMDBX_WITHOUT_MSVC_CRT:BOOL=${{ matrix.without_crt }}" \
          "--config|${{ matrix.build-type }}" "--build-config|${{ matrix.build-type }}"
